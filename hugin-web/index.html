<!doctype html>
<html lang="nb" data-palette="hugin" data-typeskin="nordic">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hugin</title>
    <script>
      // Inline so the theme lands before first paint (no light-flash). Dark is default.
      (() => {
        let theme = 'dark';
        try { theme = localStorage.getItem('theme') || 'dark'; } catch { /* storage blocked — keep dark */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
