<!doctype html>
<html lang="nb" data-palette="hugin">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hugin</title>
    <meta name="theme-color" content="#080909" />
    <meta
      name="description"
      content="Hugin watches Norwegian public registries for new companies and job ads in your region and tracks your outreach pipeline — a local job radar for developers."
    />
    <meta property="og:title" content="Hugin — job radar for the Norwegian developer market" />
    <meta
      property="og:description"
      content="Hugin watches Norwegian public registries for new companies and job ads in your region and tracks your outreach pipeline — a local job radar for developers."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/malinfossum/hugin/main/docs/brand/social-preview.png"
    />
    <meta property="og:url" content="https://github.com/malinfossum/hugin" />
    <meta property="og:type" content="website" />
    <script>
      // Inline so the theme lands before first paint (no light-flash). Dark is default.
      (() => {
        let theme = 'dark';
        try { theme = localStorage.getItem('theme') || 'dark'; } catch { /* storage blocked — keep dark */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
